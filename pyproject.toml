[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "starforge"
version = "0.1.0"
description = "Audit a repository for GitHub star-readiness signals."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Starforge Contributors"}]
keywords = ["github", "open-source", "cli", "readme", "repository-audit"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/sanjay289/starforge"
Issues = "https://github.com/sanjay289/starforge/issues"

[project.scripts]
starforge = "starforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
